<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bubble Blaster</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23050510' stroke='%2300ffcc' stroke-width='6'/><circle cx='50' cy='50' r='30' fill='%2300ffcc' opacity='0.35'/><circle cx='38' cy='38' r='10' fill='white' opacity='0.8'/></svg>">

  <!-- Inline critical styles: splash screen renders BEFORE any JS/CSS loads -->
  <style>
    /* Splash screen — shown immediately, hidden when game JS loads */
    body { margin: 0; background: #050510; }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #050510;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease-out;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: #00ffcc;
      text-shadow: 0 0 30px rgba(0,255,204,0.6), 0 0 80px rgba(0,255,204,0.2);
      letter-spacing: 6px;
      margin-bottom: 4px;
      animation: splash-glow 2s ease-in-out infinite alternate;
    }

    .splash-title-alt {
      font-family: 'Orbitron', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: #ff3399;
      text-shadow: 0 0 30px rgba(255,51,153,0.6), 0 0 80px rgba(255,51,153,0.2);
      letter-spacing: 6px;
      margin-top: -8px;
      animation: splash-glow-pink 2s ease-in-out infinite alternate;
    }

    .splash-loader {
      margin-top: 48px;
      width: 120px;
      height: 3px;
      background: rgba(0,255,204,0.15);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .splash-loader::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: #00ffcc;
      border-radius: 3px;
      box-shadow: 0 0 12px rgba(0,255,204,0.8);
      animation: splash-bar 1.2s ease-in-out infinite;
    }

    .splash-text {
      margin-top: 20px;
      font-family: 'Space Mono', monospace, sans-serif;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    @keyframes splash-glow {
      from { text-shadow: 0 0 20px rgba(0,255,204,0.4), 0 0 60px rgba(0,255,204,0.1); }
      to   { text-shadow: 0 0 40px rgba(0,255,204,0.8), 0 0 100px rgba(0,255,204,0.3); }
    }

    @keyframes splash-glow-pink {
      from { text-shadow: 0 0 20px rgba(255,51,153,0.4), 0 0 60px rgba(255,51,153,0.1); }
      to   { text-shadow: 0 0 40px rgba(255,51,153,0.8), 0 0 100px rgba(255,51,153,0.3); }
    }

    @keyframes splash-bar {
      0%   { left: -40%; }
      100% { left: 100%; }
    }

    @media (max-width: 480px) {
      .splash-title, .splash-title-alt { font-size: 28px; letter-spacing: 3px; }
      .splash-text { font-size: 8px; }
    }
  </style>

  <!-- Preload fonts so splash text renders correctly -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap">
</head>
<body>

  <!-- Splash screen: visible instantly, fades out when game is ready -->
  <div id="splash">
    <div class="splash-title">BUBBLE</div>
    <div class="splash-title-alt">BLASTER</div>
    <div class="splash-loader"></div>
    <div class="splash-text">Loading</div>
  </div>

  <!-- Background: twinkling stars (separate canvas for performance) -->
  <canvas class="stars" id="stars"></canvas>

  <!-- Title bar -->
  <div class="title">Bubble Blaster<span class="title-sub"> · Neon Bubble Popping Arcade</span></div>

  <!-- HUD: score, level, shots, combos -->
  <div class="hud">
    <div class="hud-block">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="scoreDisplay">0</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Level</div>
      <div class="hud-value pink" id="levelDisplay">1</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Shots</div>
      <div class="hud-value yellow" id="shotsDisplay">20</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Combos</div>
      <div class="hud-value" id="comboDisplay">0</div>
    </div>
  </div>

  <!-- Game area -->
  <div id="gameWrapper">
    <canvas id="gameCanvas" width="420" height="540"></canvas>

    <!-- Overlay: world map, results, game over — content generated by Game.js -->
    <div id="overlay" class="hidden"></div>
  </div>

  <!-- Attribution badge -->
  <div class="portfolio-badge">
    A K3 GAMES STUDIO GAME<br>
    by Kelvin Biffi<br>
    <a href="https://github.com/kelvinbiffi/Bubble-Shooter" target="_blank" rel="noopener" class="github-link">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" style="vertical-align: -2px; margin-right: 4px;">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>Source Code
    </a>
  </div>

  <!-- Entry point — Vite resolves all imports from here -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
